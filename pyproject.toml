[project]
name = "atlassian-automation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "anthropic>=0.116.0",
    "atlassian-python-api>=4.0.7",
    "fastapi>=0.139.1",
    "httpx>=0.28.1",
    "langchain>=1.3.13",
    "langchain-anthropic>=1.4.8",
    "langgraph>=1.2.9",
    "langsmith>=0.10.5",
    "loguru>=0.7.3",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymsteams>=0.2.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.2",
    "redis>=8.0.1",
    "requests>=2.34.2",
    "slack-sdk>=3.43.0",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.15.22",
]
